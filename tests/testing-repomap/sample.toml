[package]
name = "my-crate"
version = "0.1.0"
edition = "2021"
authors = ["Dev <dev@example.com>"]
description = "A sample Rust crate"

[lib]
name = "my_crate"
path = "src/lib.rs"

[[bin]]
name = "cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"

[dev-dependencies]
mockall = "0.11"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
